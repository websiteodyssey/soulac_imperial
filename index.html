<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0806" />

    <!-- Chemins relatifs : le site est déployé sous un sous-répertoire (base "./"). -->
    <link rel="icon" type="image/png" href="./images/logo-mark.png" />
    <link rel="apple-touch-icon" href="./images/logo-mark.png" />

    <title>Soulac Impérial — Cuisine chinoise & japonaise à Soulac-sur-Mer</title>
    <meta
      name="description"
      content="Soulac Impérial, table chinoise et japonaise à Soulac-sur-Mer : sushis taillés minute, bouchées vapeur et woks, dans une salle aux fresques à l'encre, à cinq minutes de l'océan. Ouvert 7j/7, midi et soir."
    />
    <link rel="canonical" href="https://websiteodyssey.github.io/soulac_imperial/" />

    <!--
      Image LCP de l'accueil : la façade au crépuscule.
      Le préchargement doit décrire EXACTEMENT le même jeu de sources que la
      balise <img> rendue ensuite (voir components/Photo). Sans `imagesrcset`,
      le navigateur précharge la grande image puis télécharge la vignette qu'il
      finit par afficher : deux fichiers au lieu d'un, et le mauvais en priorité.
    -->
    <link
      rel="preload"
      as="image"
      href="./images/facade.webp"
      imagesrcset="./images/facade-sm.webp 640w, ./images/facade.webp 1400w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!--
      Polices : appelées ici plutôt que par un @import dans la feuille de style.
      Déclarées dans le CSS, elles n'étaient découvertes qu'une fois celui-ci
      téléchargé et analysé — soit trois secondes de retard sur mobile. Dans le
      <head>, le navigateur les demande dès la lecture du document.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500&display=swap"
    />

    <!-- Les réseaux sociaux n'acceptent que des URL absolues pour l'aperçu. -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:site_name" content="Soulac Impérial" />
    <meta property="og:url" content="https://websiteodyssey.github.io/soulac_imperial/" />
    <meta property="og:title" content="Soulac Impérial — Cuisine chinoise & japonaise à Soulac-sur-Mer" />
    <meta
      property="og:description"
      content="L'Orient s'invite face à l'Atlantique. Sushis, bouchées vapeur et woks à Soulac-sur-Mer, à cinq minutes de la plage."
    />
    <meta
      property="og:image"
      content="https://websiteodyssey.github.io/soulac_imperial/images/facade.webp"
    />
    <meta property="og:image:width" content="1400" />
    <meta property="og:image:height" content="560" />
    <meta property="og:image:alt" content="La façade du Soulac Impérial au crépuscule" />
    <meta name="twitter:card" content="summary_large_image" />
